spring:
  datasource:
    url: ${JDBC_DATABASE_URL}
    username: ${JDBC_DATABASE_USERNAME}
    password: ${JDBC_DATABASE_PASSWORD}
    hikari:
      idle-timeout: 30000      # 30 seconds - close idle conns before Heroku kills the socket
      max-lifetime: 1800000    # 30 minutes - force rotate connections periodically
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1


  jpa:
    hibernate:
      ddl-auto: update    # Disable auto DDL since Flyway handles schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true






  flyway:
    enabled: true
    baseline-on-migrate: true    # Useful if DB already has existing tables
    locations: classpath:db/migration
    url: ${JDBC_DATABASE_URL}
    user: ${JDBC_DATABASE_USERNAME}
    password: ${JDBC_DATABASE_PASSWORD}

server:
  port: ${PORT:8080}            # Heroku provides PORT automatically

# Optional: logging
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.flywaydb: DEBUG
